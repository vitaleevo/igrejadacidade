# Override de produção — sem reload, sem bind de código, com restart e limites.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    restart: always
    ports: []  # não expor Postgres para o host em prod
    command: ["postgres", "-c", "max_connections=100"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    volumes:
      - uploads:/app/uploads
    ports: []  # só via Nginx
    environment:
      APP_ENV: production
      DEBUG: "false"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips '*'"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        DOCKER_BUILD: "true"
    restart: always
    volumes: []
    ports: []  # só via Nginx
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://igrejadacidadeluanda.org}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://igrejadacidadeluanda.org}
      NEXT_PUBLIC_TESTIMONIES_URL: ${NEXT_PUBLIC_TESTIMONIES_URL:-https://testimonies.igrejadacidadeluanda.org}
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      # - "443:443"  # descomentar após TLS + montar ./nginx/certs
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - rccg-network

networks:
  rccg-network:
    driver: bridge
