# Nginx prod — VPS serve SÓ a API (api.igrejadacidadeluanda.org -> backend:8000).
# O site (apex/www/testimonies) está na Vercel. Não proxies de frontend aqui.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d db backend nginx
# TLS via certbot (ver docs/DEPLOY-ANGOWEB.md passo 5).

upstream backend_upstream { server backend:8000; }

# HTTP: ACME challenge + redirect para HTTPS (ativar redirect após emitir cert)
server {
  listen 80;
  server_name api.igrejadacidadeluanda.org;

  client_max_body_size 55m;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location / {
    # Descomentar após TLS ativo:
    # return 301 https://$host$request_uri;
    proxy_pass http://backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 55m;
  }
}

