# Nginx prod — TLS termina no provedor (Cloudflare/LB). Este bloco é para VPS própria.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requer certs em ./nginx/certs/ (ou terminar TLS no edge e usar apenas :80 interno).

upstream frontend_upstream { server frontend:3000; }
upstream backend_upstream { server backend:8000; }

server {
  listen 80;
  server_name igrejadacidadeluanda.org www.igrejadacidadeluanda.org;

  client_max_body_size 55m;

  # ACME challenge (Let's Encrypt)
  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  # Redirect para HTTPS quando houver cert (descomentar após emitir):
  # return 301 https://$host$request_uri;

  location /api/ {
    proxy_pass http://backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 55m;
  }

  location / {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name testimonies.igrejadacidadeluanda.org;

  client_max_body_size 55m;

  location /api/ {
    proxy_pass http://backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
