services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rccg
      POSTGRES_USER: rccg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rccg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rccg"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rccg:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}@db:5432/rccg
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no ficheiro .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Defina ADMIN_API_KEY no ficheiro .env}
      CORS_ORIGINS: '["http://localhost:3000","http://testimonies.localhost:3000","https://igrejadacidadeluanda.org","https://testimonies.igrejadacidadeluanda.org"]'
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    networks:
      - rccg-network
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TESTIMONIES_URL: http://testimonies.localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev
    networks:
      - rccg-network

volumes:
  pgdata:
  uploads:

networks:
  rccg-network:
    driver: bridge
